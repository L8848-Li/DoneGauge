name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    env:
      DONEGAUGE_PYTHON: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run check
        if: matrix.node == 24
      - name: Test the core and CLI on Node.js 22
        if: matrix.node == 22
        shell: bash
        run: |
          npm run build
          tests=()
          for file in dist/tests/*.test.js; do
            if [[ "$file" != dist/tests/dsh.test.js ]]; then
              tests+=("$file")
            fi
          done
          node --test "${tests[@]}"
      - run: npm run test:package
